# Isolated compose project: its own network/volumes, cannot collide with other
# stacks on the same VPS (the default project name would be the folder "deploy").
name: fratelanza-chat

services:
  postgres:
    image: postgres:16-alpine
    container_name: fratelanza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fratelanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fratelanza_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fratelanza}
    volumes:
      - fratelanza_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fratelanza} -d ${POSTGRES_DB:-fratelanza}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lotus_net

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fratelanza_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-fratelanza}:${POSTGRES_PASSWORD:-fratelanza_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-fratelanza}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      RUN_SEED: ${RUN_SEED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v22.0}
    networks:
      - lotus_net

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    container_name: fratelanza_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Loopback only by default: put HTTPS (nginx/Caddy) in front. Set
      # WEB_BIND=0.0.0.0 only for a short plain-HTTP test.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-17156}:80"
    networks:
      - lotus_net

volumes:
  fratelanza_db_data:

networks:
  lotus_net:
    driver: bridge
